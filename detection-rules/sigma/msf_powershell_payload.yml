title: Potential MSF PowerShell Payload Observed
id: 31c929ea-e3a7-488f-8b43-f3179abcdf52
status: experimental
description: Detects cmd.exe spawning a PowerShell payload with obfuscation markers (hidden window, NOP sled) commonly generated by msfvenom.
references:
    - TCM Security Detection Engineering for Beginners course
author: Franck B. (converted from TCM prebuilt Kibana rule)
date: 2026-08-12
tags:
    - attack.execution
    - attack.t1059
    - attack.t1059.001
logsource:
    product: windows
    category: process_creation
detection:
    selection_parent:
        Image|endswith: '\cmd.exe'
    selection_content:
        CommandLine|contains|all:
            - 'powershell'
            - 'hidden'
            - 'nop'
    condition: selection_parent and selection_content
falsepositives:
    - Legitimate scripts coincidentally combining these three terms (uncommon)
level: low