title: Suspicious File Written to Temp Directory
id: 31c929ea-e3a7-488f-8b43-f3179abcdf52
status: experimental
description: Detects PowerShell writing a .ps1 file to Windows\Temp, often indicative of a staged secondary payload or dropped script.
references:
    - TCM Security Detection Engineering for Beginners course
author: Franck B. (converted from TCM prebuilt Kibana rule)
date: 2026-08-14
tags:
    - attack.discovery
    - attack.t1082
    - attack.t1217
logsource:
    product: windows
    category: file_event
detection:
    selection_img:
        Image|endswith: '\powershell.exe'
    selection_file:
        TargetFilename|contains: '\Windows\Temp\'
        TargetFilename|endswith: '.ps1'
    condition: selection_img and selection_file
falsepositives:
    - Legitimate PowerShell automation scripts staged in Temp by IT tooling
level: low