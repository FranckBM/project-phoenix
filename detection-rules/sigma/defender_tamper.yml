title: Windows Defender Real-Time Protection Disabled via PowerShell
id: 31c929ea-e3a7-488f-8b43-f3179abcdf52
status: experimental
description: Detects use of the Set-MpPreference cmdlet to disable Windows Defender real-time monitoring, a common defense evasion step before dropping malicious payloads.
references:
    - https://attack.mitre.org/techniques/T1562/001/
author: Franck B.
date: 2026-08-13
tags:
    - attack.defense-evasion
    - attack.t1562.001
logsource:
    product: windows
    category: process_creation
detection:
    selection_img:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_cmd:
        CommandLine|contains: 'Set-MpPreference'
    selection_disable:
        CommandLine|contains:
            - 'DisableRealtimeMonitoring'
            - 'DisableAntiSpyware'
            - 'DisableBehaviorMonitoring'
            - 'DisableIOAVProtection'
    condition: selection_img and selection_cmd and selection_disable
falsepositives:
    - Legitimate IT-managed endpoint configuration scripts (rare in most environments; genuinely worth alerting on)
level: high