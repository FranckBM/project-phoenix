title: Entra ID Application Credentials Changed
id: f97a3276-c7fa-421a-b4eb-3a193d17edcf
status: experimental
description: Detects a successful change to the secrets or certificates of a Microsoft Entra ID application registration. An attacker with access to an application can add their own client secret or certificate to keep access to the tenant even after a password reset. The rule cannot yet tell an addition from a removal (see falsepositives).
references:
    - https://attack.mitre.org/techniques/T1098/001/
author: Franck
date: 2026-10-20
tags:
    - attack.persistence
    - attack.privilege_escalation
    - attack.t1098.001
logsource:
    product: azure
    service: auditlogs
detection:
    selection:
        event.provider: 'azure.entra'
        entra.audit.category: 'ApplicationManagement'
        event.action|contains: 'Certificates and secrets management'
        event.outcome: 'success'
    condition: selection
falsepositives:
    - Planned secret or certificate rotation by application owners or deployment pipelines
    - Credential removals, which produce the same activity name as additions. Filtering on the modified-property value was tried and did not work (wildcard queries on the newValue field returned nothing although the field is populated), so additions and removals are not yet separated
    - Lab setup activity (creating the audit reader app's own secret)
level: medium