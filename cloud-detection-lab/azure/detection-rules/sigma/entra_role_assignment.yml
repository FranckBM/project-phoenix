title: Entra ID Directory Role Assigned to User
id: 8e2f6c1a-4b7d-4f3e-9a52-1c6d0e7b3f94
status: experimental
description: |
  Detects a successful assignment of a Microsoft Entra ID directory role to a
  principal ("Add member to role", category RoleManagement). Role assignment is a
  common privilege escalation and persistence step after an identity compromise.
  The rule alerts on every directory role, not only privileged ones; the role is in
  entra.audit.targetResources.modifiedProperties (displayName Role.DisplayName /
  Role.TemplateId), and the target principal in entra.audit.targetResources.userPrincipalName.
references:
  - https://attack.mitre.org/techniques/T1098/003/
  - https://learn.microsoft.com/en-us/entra/identity/monitoring-health/reference-audit-activities
author: Franck (Project Phoenix)
date: 2026-10-28
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1098.003
logsource:
  product: azure
  service: entra_audit
  definition: Entra ID audit logs pulled from Microsoft Graph /auditLogs/directoryAudits by ingest_entra_audit.py into logs-azure.entra_audit-default
detection:
  selection:
    event.action: 'Add member to role'
    event.outcome: 'success'
  condition: selection
fields:
  - user.name
  - entra.audit.targetResources.userPrincipalName
  - entra.audit.targetResources.modifiedProperties.newValue
falsepositives:
  - Legitimate administrator role assignments (onboarding, delegation, break-glass setup)
level: medium